    <ellipse cx="370" cy="180" rx="14" ry="32" transform="rotate(30 370 180)" stroke="#ba9038" stroke-width="1.4" />
    <ellipse cx="210" cy="310" rx="12" ry="26" transform="rotate(-40 210 310)" stroke="#ba9038" stroke-width="1.4" />
    <ellipse cx="390" cy="310" rx="12" ry="26" transform="rotate(40 390 310)" stroke="#ba9038" stroke-width="1.4" />

    <!-- Delicate Botanical Veins & Hatching (Engraving Style) -->
