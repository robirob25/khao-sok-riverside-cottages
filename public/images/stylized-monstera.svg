    <path d="M 298 210 C 210 245, 140 300, 85 360" stroke="#1b3527" stroke-width="1.2" />
    <path d="M 298 320 C 230 365, 175 425, 130 500" stroke="#1b3527" stroke-width="1.2" />

    <path d="M 302 120 C 370 140, 440 170, 490 210" stroke="#1b3527" stroke-width="1.2" />
    <path d="M 302 210 C 390 245, 460 300, 515 360" stroke="#1b3527" stroke-width="1.2" />
    <path d="M 302 320 C 370 365, 425 425, 470 500" stroke="#1b3527" stroke-width="1.2" />

