    <path d="M 295 150 C 250 170, 200 200, 160 230" stroke="#ba9038" stroke-width="0.8" opacity="0.6" />
    <path d="M 305 150 C 350 170, 400 200, 440 230" stroke="#ba9038" stroke-width="0.8" opacity="0.6" />
