<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Petal Gradient -->
    <radialGradient id="petal-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#cf4432" />
      <stop offset="70%" stop-color="#a82b1d" />
      <stop offset="100%" stop-color="#801c10" />
    </radialGradient>
    <!-- Central Cup Outer Gradient -->
    <radialGradient id="cup-rim" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#b83827" />
      <stop offset="60%" stop-color="#73190f" />
      <stop offset="100%" stop-color="#4a0f08" />
    </radialGradient>
    <!-- Deep Cavity Gradient -->
    <radialGradient id="cavity" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f0503" />
      <stop offset="85%" stop-color="#380a06" />
      <stop offset="100%" stop-color="#69160d" />
    </radialGradient>
    <!-- Petal Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#12281b" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 5 Petals of Rafflesia kerrii -->
    <!-- Petal 1 (Top) -->
    <g transform="translate(64,64) rotate(0) translate(-64,-64)">
      <path d="M42 60 C32 40, 36 14, 64 14 C92 14, 96 40, 86 60 Z" fill="url(#petal-grad)" stroke="#66140b" stroke-width="1.5" />
      <!-- Warts / Spots -->
      <circle cx="56" cy="25" r="3.2" fill="#faedd3" opacity="0.95" />
      <circle cx="72" cy="27" r="2.8" fill="#faedd3" opacity="0.9" />
      <circle cx="64" cy="35" r="3.5" fill="#faedd3" opacity="0.95" />
      <circle cx="50" cy="38" r="2.2" fill="#faedd3" opacity="0.85" />
      <circle cx="78" cy="40" r="2.4" fill="#faedd3" opacity="0.85" />
      <circle cx="63" cy="47" r="2.6" fill="#faedd3" opacity="0.9" />
    </g>

    <!-- Petal 2 (Top Right: 72 deg) -->
    <g transform="translate(64,64) rotate(72) translate(-64,-64)">
      <path d="M42 60 C32 40, 36 14, 64 14 C92 14, 96 40, 86 60 Z" fill="url(#petal-grad)" stroke="#66140b" stroke-width="1.5" />
      <circle cx="56" cy="25" r="3.2" fill="#faedd3" opacity="0.95" />
      <circle cx="72" cy="27" r="2.8" fill="#faedd3" opacity="0.9" />
      <circle cx="64" cy="35" r="3.5" fill="#faedd3" opacity="0.95" />
      <circle cx="50" cy="38" r="2.2" fill="#faedd3" opacity="0.85" />
      <circle cx="78" cy="40" r="2.4" fill="#faedd3" opacity="0.85" />
      <circle cx="63" cy="47" r="2.6" fill="#faedd3" opacity="0.9" />
    </g>

    <!-- Petal 3 (Bottom Right: 144 deg) -->
    <g transform="translate(64,64) rotate(144) translate(-64,-64)">
      <path d="M42 60 C32 40, 36 14, 64 14 C92 14, 96 40, 86 60 Z" fill="url(#petal-grad)" stroke="#66140b" stroke-width="1.5" />
      <circle cx="56" cy="25" r="3.2" fill="#faedd3" opacity="0.95" />
      <circle cx="72" cy="27" r="2.8" fill="#faedd3" opacity="0.9" />
      <circle cx="64" cy="35" r="3.5" fill="#faedd3" opacity="0.95" />
      <circle cx="50" cy="38" r="2.2" fill="#faedd3" opacity="0.85" />
      <circle cx="78" cy="40" r="2.4" fill="#faedd3" opacity="0.85" />
      <circle cx="63" cy="47" r="2.6" fill="#faedd3" opacity="0.9" />
    </g>

    <!-- Petal 4 (Bottom Left: 216 deg) -->
    <g transform="translate(64,64) rotate(216) translate(-64,-64)">
      <path d="M42 60 C32 40, 36 14, 64 14 C92 14, 96 40, 86 60 Z" fill="url(#petal-grad)" stroke="#66140b" stroke-width="1.5" />
      <circle cx="56" cy="25" r="3.2" fill="#faedd3" opacity="0.95" />
      <circle cx="72" cy="27" r="2.8" fill="#faedd3" opacity="0.9" />
      <circle cx="64" cy="35" r="3.5" fill="#faedd3" opacity="0.95" />
      <circle cx="50" cy="38" r="2.2" fill="#faedd3" opacity="0.85" />
      <circle cx="78" cy="40" r="2.4" fill="#faedd3" opacity="0.85" />
      <circle cx="63" cy="47" r="2.6" fill="#faedd3" opacity="0.9" />
    </g>

    <!-- Petal 5 (Top Left: 288 deg) -->
    <g transform="translate(64,64) rotate(288) translate(-64,-64)">
      <path d="M42 60 C32 40, 36 14, 64 14 C92 14, 96 40, 86 60 Z" fill="url(#petal-grad)" stroke="#66140b" stroke-width="1.5" />
      <circle cx="56" cy="25" r="3.2" fill="#faedd3" opacity="0.95" />
      <circle cx="72" cy="27" r="2.8" fill="#faedd3" opacity="0.9" />
      <circle cx="64" cy="35" r="3.5" fill="#faedd3" opacity="0.95" />
      <circle cx="50" cy="38" r="2.2" fill="#faedd3" opacity="0.85" />
      <circle cx="78" cy="40" r="2.4" fill="#faedd3" opacity="0.85" />
      <circle cx="63" cy="47" r="2.6" fill="#faedd3" opacity="0.9" />
    </g>

    <!-- Central Diaphragm / Cup Rim -->
    <circle cx="64" cy="64" r="26" fill="url(#cup-rim)" stroke="#4a0f08" stroke-width="2" />
    
    <!-- Central Aperture Opening -->
    <circle cx="64" cy="64" r="16.5" fill="url(#cavity)" />

    <!-- Raised Ring of Dots on Diaphragm Rim -->
    <g fill="#faedd3" opacity="0.9">
      <circle cx="64" cy="42" r="1.8" />
      <circle cx="77" cy="46" r="1.8" />
      <circle cx="85" cy="58" r="1.8" />
      <circle cx="82" cy="73" r="1.8" />
      <circle cx="71" cy="83" r="1.8" />
      <circle cx="57" cy="83" r="1.8" />
      <circle cx="46" cy="73" r="1.8" />
      <circle cx="43" cy="58" r="1.8" />
      <circle cx="51" cy="46" r="1.8" />
    </g>

    <!-- Central Spikes / Botanical Processes (Gold Accents) -->
    <circle cx="64" cy="64" r="5" fill="#d49a37" />
    <circle cx="64" cy="64" r="2.5" fill="#2a0805" />
    <circle cx="60" cy="61" r="1.2" fill="#f7dfa3" />
    <circle cx="68" cy="61" r="1.2" fill="#f7dfa3" />
    <circle cx="64" cy="68" r="1.2" fill="#f7dfa3" />
  </g>
</svg>
